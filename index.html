<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かけいぼ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <nav class="sidebar">
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7c0-1.1.9-2 2-2h11l4 4v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M16 12a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/></svg>
      </div>
      <span>かけいぼ</span>
    </div>

    <button class="nav-item active" data-view="entry">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>入力</span>
    </button>
    <button class="nav-item" data-view="history">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>履歴・集計</span>
    </button>
    <button class="nav-item" data-view="categories">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9m-3 0H4m16 5h-5m-3 0H4m16 5h-9m-3 0H4"/><circle cx="14" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg>
      <span>カテゴリ設定</span>
    </button>
  </nav>

  <main class="content">

    <!-- 入力画面 -->
    <section id="view-entry" class="view active">
      <h1>入力</h1>

      <form id="entry-form" class="card entry-form">
        <div class="row wrap">
          <div class="segmented" id="type-toggle">
            <button type="button" class="seg-btn seg-expense active" data-type="expense">支出</button>
            <button type="button" class="seg-btn seg-income" data-type="income">収入</button>
          </div>
          <div class="spacer"></div>
          <input type="date" id="entry-date" class="date-input" required>
        </div>

        <div class="field-block">
          <div class="field-label">大項目</div>
          <div class="chip-row" id="category-chips"></div>
        </div>

        <div class="field-block">
          <div class="field-label">小項目</div>
          <div class="chip-row" id="subcategory-chips"></div>
        </div>

        <div class="row wrap align-end">
          <div class="amount-field">
            <div class="field-label">金額</div>
            <div class="amount-input-wrap">
              <span class="yen">¥</span>
              <input type="number" id="entry-amount" min="0" step="1" placeholder="0" required>
            </div>
          </div>
          <div class="memo-field">
            <div class="field-label">メモ</div>
            <input type="text" id="entry-memo" placeholder="任意のメモ">
          </div>
          <button type="submit" class="btn-primary">保存する</button>
        </div>
      </form>

      <div class="card recent-list">
        <div class="card-title">直近の入力</div>
        <div id="recent-rows"></div>
      </div>
    </section>

    <!-- 履歴・集計画面 -->
    <section id="view-history" class="view">
      <div class="row space-between">
        <h1>履歴・集計</h1>
        <div class="month-picker">
          <button type="button" id="month-prev" class="month-arrow">‹</button>
          <input type="month" id="month-select">
          <button type="button" id="month-next" class="month-arrow">›</button>
        </div>
      </div>

      <div class="row stat-row">
        <div class="stat-card stat-income">
          <div class="stat-label">収入合計</div>
          <div class="stat-value" id="stat-income">¥0</div>
        </div>
        <div class="stat-card stat-expense">
          <div class="stat-label">支出合計</div>
          <div class="stat-value" id="stat-expense">¥0</div>
        </div>
        <div class="stat-card stat-balance">
          <div class="stat-label">収支</div>
          <div class="stat-value" id="stat-balance">¥0</div>
        </div>
      </div>

      <div class="row history-body">
        <div class="card breakdown-card">
          <div class="card-title">大項目別支出</div>
          <div id="breakdown-rows"></div>
          <div id="breakdown-empty" class="empty-note" hidden>この月の支出はまだありません</div>
        </div>

        <div class="card transactions-card">
          <div class="card-title">取引一覧</div>
          <div id="tx-rows"></div>
          <div id="tx-empty" class="empty-note" hidden>この月の取引はまだありません</div>
        </div>
      </div>
    </section>

    <!-- カテゴリ設定画面 -->
    <section id="view-categories" class="view">
      <h1>カテゴリ設定</h1>

      <div class="row categories-body">
        <div class="card category-list-card">
          <div class="card-title">大項目</div>
          <div id="category-list"></div>
          <form id="add-category-form" class="add-row">
            <input type="text" id="new-category-name" placeholder="新しい大項目名" required>
            <button type="submit" class="btn-round">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </form>
        </div>

        <div class="card subcategory-list-card">
          <div class="card-title" id="subcategory-title">小項目</div>
          <div class="card-subtitle" id="subcategory-subtitle">左の大項目を選ぶと、その小項目がここに表示されます</div>
          <div id="subcategory-list"></div>
          <form id="add-subcategory-form" class="add-row narrow">
            <input type="text" id="new-subcategory-name" placeholder="新しい小項目名" required>
            <button type="submit" class="btn-round">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </form>
        </div>
      </div>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
